<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С днём рождения!</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        overflow-x: hidden;
    }

    .container {
        text-align: center;
        padding: 40px 20px;
        max-width: 900px;
        z-index: 2;
    }

    h1 {
        font-size: 64px;
        margin-bottom: 30px;
        background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shine 3s infinite;
        line-height: 1.2;
    }

    @keyframes shine {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.3); }
    }

    .text {
        font-size: 22px;
        line-height: 1.6;
        margin-bottom: 40px;
        color: #e0e0e0;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
    }

    video {
        width: 100%;
        max-width: 700px;
        border-radius: 15px;
        box-shadow: 0 10px 50px rgba(255, 215, 0, 0.3);
        margin-bottom: 30px;
    }

    .heart {
        font-size: 40px;
        animation: heartbeat 1.5s infinite;
        margin-top: 20px;
    }

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }

    /* Конфетти */
    .confetti {
        position: fixed;
        top: -10px;
        width: 10px;
        height: 10px;
        z-index: 1;
        animation: fall linear infinite;
    }

    @keyframes fall {
        to { transform: translateY(100vh) rotate(720deg); }
    }
</style>
</head>
<body>

<div class="container">
    <h1>С днём рождения!</h1>

    <p class="text">
        Папа, с твоим днём! Спасибо за всё, что ты для меня делаешь.
        Ты лучший. Здоровья тебе, удачи и чтобы всё было классно!
    </p>

    <!-- ЗАМЕНИ video.mp4 НА СВОЙ ФАЙЛ, ЕСЛИ НАЗЫВАЕТСЯ ИНАЧЕ -->
    <video controls autoplay muted loop>
        <source src="video.mp4" type="video/mp4">
        Твой браузер не поддерживает видео.
    </video>

    <div class="heart">❤️ </div>
</div>

<script>
    // Конфетти
    const colors = ['#ffd700', '#ff8c00', '#ff4757', '#5f27cd', '#00d2d3', '#ff6b81'];

    function createConfetti() {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (3 + Math.random() * 3) + 's';
        c.style.animationDelay = Math.random() * 2 + 's';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        document.body.appendChild(c);

        setTimeout(() => c.remove(), 8000);
    }

    setInterval(createConfetti, 200);
</script>

</body>
</html>
